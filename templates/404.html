<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page not found</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <style>
      body {
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Helvetica Neue",
          Arial,
          sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
      }
      .error-code {
        font-size: 8rem;
        font-weight: 800;
        line-height: 1;
        background: linear-gradient(45deg, #0d6efd, #0dcaf0);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: -2px;
      }
      @media (min-width: 768px) {
        .error-code {
          font-size: 10rem;
        }
      }
      .card-custom {
        border: none;
        border-radius: 1.25rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        background: #ffffff;
      }
      .illustration-svg {
        max-width: 220px;
        height: auto;
      }
    </style>
  </head>
  <body>
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-11 col-sm-9 col-md-8 col-lg-6">
          <div class="card card-custom p-4 p-md-5 text-center">
            <!-- SVG Ілюстрація -->
            <div class="mb-3">
              <svg
                class="illustration-svg"
                viewBox="0 0 200 150"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <circle cx="100" cy="75" r="60" fill="#e7f1ff" />
                <path
                  d="M65 85C65 85 75 70 100 70C125 70 135 85 135 85"
                  stroke="#0d6efd"
                  stroke-width="6"
                  stroke-linecap="round"
                />
                <circle cx="75" cy="55" r="7" fill="#0d6efd" />
                <circle cx="125" cy="55" r="7" fill="#0d6efd" />
                <path
                  d="M140 100L160 120"
                  stroke="#0dcaf0"
                  stroke-width="8"
                  stroke-linecap="round"
                />
                <circle
                  cx="130"
                  cy="90"
                  r="18"
                  stroke="#0dcaf0"
                  stroke-width="6"
                  fill="none"
                />
              </svg>
            </div>

            <!-- Великий код помилки -->
            <h1 class="error-code mb-2">404</h1>

            <!-- Заголовок і текст -->
            <h2 class="h4 fw-bold mb-3 text-dark">Oops! Page not foundо</h2>
            <p class="text-muted mb-4 fs-6">
              It seems the address was entered incorrectly, or the page has been
              moved. Try finding the information you need using the search, or
              return to the home page.
            </p>

            <!-- Форма пошуку -->
            <form action="#" method="GET" class="mb-4">
              <div class="input-group input-group-lg">
                <input
                  type="text"
                  class="form-control fs-6"
                  placeholder="Що ви шукаєте?..."
                  aria-label="Пошук"
                  required
                />
                <button class="btn btn-primary" type="submit">
                  <i class="bi bi-search"></i>
                </button>
              </div>
            </form>

            <!-- Кнопки навігації -->
            <div
              class="d-flex flex-column flex-sm-row gap-2 justify-content-center"
            >
              <a href="/" class="btn btn-primary btn-lg px-4 fs-6 fw-semibold">
                <i class="bi bi-house-door me-2"></i>To home
              </a>
              <button
                onclick="history.back()"
                class="btn btn-outline-secondary btn-lg px-4 fs-6 fw-semibold"
              >
                <i class="bi bi-arrow-left me-2"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
